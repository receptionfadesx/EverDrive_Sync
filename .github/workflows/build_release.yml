name: Build & Release

on:
  push:
    tags:
      - "v*"  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v3.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # Required to create GitHub Releases and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the others mid-upload; we want
      # to see every platform's result in a single run.
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: sync_everdrive-windows
            dist_path: dist/sync_everdrive.exe
          - os: macos-latest
            artifact_name: sync_everdrive-macos
            dist_path: dist/sync_everdrive.app
          - os: ubuntu-latest
            artifact_name: sync_everdrive-linux
            dist_path: dist/sync_everdrive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        # Uses the same spec file as build_windows.bat / build_linux.sh /
        # build_macos.sh so CI and local builds cannot drift apart. The spec
        # handles the per-platform icon, asset bundling, customtkinter
        # collection, and the macOS .app bundle.
        run: pyinstaller --clean --noconfirm sync_everdrive.spec
        shell: bash

      - name: Zip artifact (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            powershell -Command "Compress-Archive -Path ${{ matrix.dist_path }} -DestinationPath ${{ matrix.artifact_name }}.zip"
          else
            zip -j ${{ matrix.artifact_name }}.zip ${{ matrix.dist_path }}
          fi
        shell: bash

      - name: Zip artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: zip -r ${{ matrix.artifact_name }}.zip ${{ matrix.dist_path }}

      # Hand the zip to the single release job below rather than uploading it
      # here. When each matrix job published directly, all three raced to
      # create the same release: the first won, the others could not yet see
      # the tag, created their own untagged drafts, and then failed to
      # finalize with "already_exists".
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        # Exactly one job touches the release, so there is no create/finalize
        # race regardless of how closely the builds finish together.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/**/*.zip
          generate_release_notes: true
