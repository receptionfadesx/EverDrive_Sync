name: Run Tests

on:
  push:
    branches: [ main, "feature/*", "claude/*", "fix/*", "refactor/*" ]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Run Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: |
          python -m pytest
